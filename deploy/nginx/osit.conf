# Serves the OS Installation Tool as static files.
#
# The web app is a plain bundle: no Node, no PHP, no database, no reverse proxy
# to an app server. Everything privileged happens in the helper on the user's
# own machine, not here.
#
#   sudo cp osit.conf /etc/nginx/sites-available/osit.conf
#   sudo ln -s /etc/nginx/sites-available/osit.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name os.brionicx.com;

    # Let certbot answer, send everything else to https.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name os.brionicx.com;

    ssl_certificate     /etc/letsencrypt/live/os.brionicx.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/os.brionicx.com/privkey.pem;

    root /var/www/osit;
    index index.html;

    # The page asks the browser to talk to http://127.0.0.1:5179, which is the
    # user's own machine. Chromium treats localhost as a trustworthy origin, so
    # this is not mixed content, but connect-src has to allow it explicitly.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' http://127.0.0.1:5179 http://localhost:5179 ws://127.0.0.1:5179 ws://localhost:5179; frame-ancestors 'none'; base-uri 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Asset file names carry a content hash, so they can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
