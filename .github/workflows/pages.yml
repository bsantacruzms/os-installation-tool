name: Deploy web app to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'packages/web/**'
      - 'packages/shared/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The shared package is the source of truth for the catalog and the answer
      # file, so its tests gate the deploy.
      - name: Test the shared logic
        run: |
          npm --prefix packages/shared install
          npm --prefix packages/shared run test

      - name: Build the web app
        run: |
          npm --prefix packages/web install
          npm --prefix packages/web run build

      - name: Add the custom domain
        run: echo 'os.brionicx.com' > packages/web/dist/CNAME

      - name: Disable Jekyll processing
        run: touch packages/web/dist/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
